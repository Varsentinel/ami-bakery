# With Traefik disabled there is no other ingress controller on this image, so
# Kong becomes the default: Ingress objects that omit ingressClassName are
# still picked up.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: kong
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: ingress-controllers.konghq.com/kong
